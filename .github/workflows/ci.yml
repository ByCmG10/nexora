name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The unit/MockMvc tests use H2; ProductPostgresIntegrationTests starts its own PostgreSQL through
      # Testcontainers, using the Docker daemon already present on the runner. No secrets are needed.
      - name: Build and test
        run: ./mvnw -B clean verify
