spring.application.name=nexora-test

# Isolated in-memory database (PostgreSQL compatibility mode): tests never touch the development PostgreSQL.
spring.datasource.url=jdbc:h2:mem:nexora-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Test-only credentials, unrelated to the development ones.
spring.security.user.name=nexora_test
spring.security.user.password=nexora-test-password

# Same schema as production: created by Flyway, only validated by Hibernate.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
